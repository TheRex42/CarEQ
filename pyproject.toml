[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careq"
version = "0.1.0"
description = "Measure and tune a car head unit's fixed-band graphic EQ toward a target curve using a phone mic."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
careq = "careq.cli:main"

[tool.setuptools]
packages = ["careq"]

[tool.setuptools.package-data]
careq = ["targets/*.csv", "targets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
